name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  screenshot-tools:
    name: Screenshot skill tools
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.tools == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful change selection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
      - name: Test screenshot skill tools
        run: python3 .agents/skills/screener-app-store-screenshots/scripts/test_tools.py

  swift-test:
    name: Swift package tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.swift == 'true') }}
    runs-on: macos-26
    # A cold hosted Simulator can spend 11+ minutes starting the test session.
    # Leave room for package builds and runner cleanup as well as the tests.
    timeout-minutes: 30
    steps:
      - name: Require successful change selection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Test package
        run: swift test
      - name: Build for iOS Simulator
        run: swift build --triple arm64-apple-ios16.0-simulator --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)"
      - name: Build macOS fixture app
        run: swift build --package-path Examples/ScreenerFixture
      - name: Test UIKit capture on Simulator
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate --spec Examples/UIKitCaptureFixture/project.yml
          simulator_id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for group in devices.values() for d in group if "iPhone" in d["name"]))
          ')
          xcodebuild test \
            -project Examples/UIKitCaptureFixture/UIKitCaptureFixture.xcodeproj \
            -scheme UIKitCaptureFixture \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath .build/uikit-fixture \
            CODE_SIGNING_ALLOWED=NO
